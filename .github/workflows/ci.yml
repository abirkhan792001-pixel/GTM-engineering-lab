name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test and smoke-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Offline: every Claude call in the suite goes to an injected fake client.
      - name: Unit tests
        run: npm test

      # Offline dev runners (mock providers and the deterministic scorer). They exit
      # non-zero on schema violations or failed self-checks, so they double as smoke tests.
      - name: Smoke-run pipeline stages
        run: |
          npm run signals
          npm run enrich:dev
          npm run qualify:dev
          npm run activate:dev
          npm run pipeline:run
          npm run learn:dev

      # With no API key configured, the live runner must skip cleanly.
      - name: Live runner skips without a key
        env:
          ANTHROPIC_API_KEY: ''
        run: npm run qualify:live
