name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test and smoke-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Offline: every Claude call in the suite goes to an injected fake client.
      - name: Unit tests
        run: npm test

      # Offline dev runners (mock providers and the deterministic scorer). They exit
      # non-zero on schema violations or failed self-checks, so they double as smoke tests.
      - name: Smoke-run pipeline stages
        run: |
          npm run signals:dev
          npm run enrich:dev
          npm run qualify:dev
          npm run contacts:dev
          npm run activate:dev
          npm run pipeline:run
          npm run learn:dev

      # Boot the webhook server in mock mode, post a signal, and wait for the pipeline result.
      - name: Webhook server smoke test
        run: |
          PORT=3100 npm run server:dev > server.log 2>&1 &
          for i in $(seq 1 50); do curl -sf localhost:3100/health > /dev/null && break; sleep 0.2; done
          id=$(curl -sf -X POST localhost:3100/api/webhooks/signal -H 'content-type: application/json' \
            -d '{"eventType":"contact_form","source":"ci","email":"lena.hoffmann@northwind-data.example"}' \
            | node -e "process.stdin.on('data', d => console.log(JSON.parse(d).leadId))")
          for i in $(seq 1 50); do
            status=$(curl -sf "localhost:3100/api/leads/$id" | node -e "process.stdin.on('data', d => console.log(JSON.parse(d).status))")
            [ "$status" != processing ] && break; sleep 0.2
          done
          cat server.log
          test "$status" = done

      # With no API key configured, the live runner must skip cleanly.
      - name: Live runner skips without a key
        env:
          ANTHROPIC_API_KEY: ''
        run: npm run qualify:live
